<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Treasure Match</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1b1426;color:#f5e6b8;font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#top{width:min(96vw,560px);display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
h1{margin:0;font-size:24px;color:#ffd75e}
#hud{width:min(96vw,560px);display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:6px}
.stat{background:#2d1f3d;border:2px solid #6b4a1e;border-radius:8px;padding:3px 4px;text-align:center}
.stat small{display:block;font-size:13px;color:#cdb987}
.stat b{font-size:20px;color:#fff3c4}
#goalbar{grid-column:1/4;height:14px;background:#3a2814;border-radius:7px;overflow:hidden;border:1px solid #6b4a1e}
#goalfill{height:100%;width:0;background:linear-gradient(90deg,#ffb300,#ffe066);transition:width .3s}
button{background:#7a4b16;color:#ffe9a8;border:2px solid #ffd75e;border-radius:10px;padding:8px 16px;font:inherit;font-size:18px;cursor:pointer;min-height:48px}
.big{font-size:22px;padding:12px 22px;margin:6px;min-width:140px}
.good{background:#1f6b35}.bad{background:#7a1f1f}
canvas{border:3px solid #6b4a1e;border-radius:8px;background:#2a1d10;touch-action:none;-webkit-touch-callout:none;width:min(96vw,calc((100dvh - 250px)*0.6),560px);height:auto}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5}
.box{background:#2d1f3d;border:3px solid #ffd75e;border-radius:14px;padding:20px;text-align:center;width:min(92vw,440px);font-size:20px;line-height:1.4}
.box h2{margin:0 0 8px;color:#ffd75e}
.box ul{text-align:left;padding-left:22px;margin:8px 0}
.box li{margin:6px 0}
</style></head><body>
<div id="top"><h1>Treasure Match</h1><div><button id="helpBtn" aria-label="How to play">?</button> <button id="restart">Restart</button></div></div>
<div id="depth" style="font-size:22px;color:#ffe9a8;margin-bottom:4px">Depth 1: Topsoil</div>
<div id="hud">
  <div class="stat"><small>Depth</small><b id="level">1</b></div>
  <div class="stat"><small>Moves left</small><b id="moves">20</b></div>
  <div class="stat"><small>Loot multiplier</small><b id="mult">x1</b></div>
  <div class="stat"><small>Score / goal</small><b id="goal">0/0</b></div>
  <div class="stat"><small>Loot (at risk)</small><b id="loot">0</b></div>
  <div class="stat"><small>Bank (safe)</small><b id="bank">0</b></div>
  <div id="goalbar"><div id="goalfill"></div></div>
</div>
<div style="position:relative"><canvas id="c"></canvas><div id="toast" style="display:none;position:absolute;left:0;right:0;top:40%;text-align:center;font-size:30px;font-weight:bold;text-shadow:0 2px 6px #000,0 0 3px #000;pointer-events:none"></div></div>
<div id="modal" class="modal"><div class="box"><div id="msg"></div><div id="btns"></div></div></div>
<script>
// ===== Tuning constants =====
const COLS = 6, ROWS = 10, TILE = 56;
const TYPES = ['ruby','emerald','sapphire','amethyst','topaz','coin'];
const MYSTERY = 'mystery';
const DIAMOND = 'diamond', DIAMOND_MIN_LEVEL = 3, DIAMOND_POINTS_FACTOR = 3; // rare deep jewel, worth 3x
const DEPTHS = [ // name, page bg, board tiles A/B, border; levels past the list reuse the last with a number
  { name: 'Topsoil',        bg: '#2a1f17', a: '#5a4127', b: '#4f3920', edge: '#8a6a3e' },
  { name: 'Copper Caves',   bg: '#22140e', a: '#5a3018', b: '#4c2812', edge: '#b8692e' },
  { name: 'Crystal Grotto', bg: '#121428', a: '#2b2a52', b: '#232246', edge: '#7f8cff' },
  { name: "Dragon's Hoard", bg: '#1c0808', a: '#3d1410', b: '#320f0c', edge: '#ffb300' },
  { name: 'The Abyss',      bg: '#050308', a: '#1a1222', b: '#140d1a', edge: '#c04dff' },
];
const DIG_TRANSITION_MS = 1400;
const CHEST = 'chest', CHEST_CHANCE = 0.015;  // buried chest: can't swap, dug out by a match next to it
const CHEST_GOLD_ODDS = 0.75, CHEST_GOLD = 300, CHEST_TRAP_MOVES = 3;
const TOAST_MS = 1600;
const POINTS_PER_PIECE = 10;          // base points per cleared piece (before combo & multiplier)
const MOVES_PER_LEVEL = 20;
const BASE_TARGET = 500;              // level 1 goal (level score, multiplier applied)
const TARGET_GROWTH = 1.6;            // each level's goal = previous * this
const MULT_PER_LEVEL = 1.5;           // loot multiplier = this ^ (level-1)
const MYSTERY_BASE_CHANCE = 0.03;     // chance a new piece is a mystery piece at level 1
const MYSTERY_CHANCE_PER_LEVEL = 0.01;
const MYSTERY_KINDS = {               // win odds, base reward (x multiplier), spawn weight at level 1, extra weight per level
  sparkle: { win: 0.80, reward: 150,  weight: 5, perLevel: 0,   name: 'Sparkling gem' },
  plain:   { win: 0.50, reward: 500,  weight: 3, perLevel: 0.5, name: 'Plain box' },
  skull:   { win: 0.25, reward: 2000, weight: 1, perLevel: 1,   name: 'Cracked skull' },
};
const SWAP_MS = 140, CLEAR_MS = 220, FALL_SPEED = 0.025;
const DRAG_THRESHOLD = TILE * 0.35;
const BANK_KEY = 'treasureMatch.bank', HELP_KEY = 'treasureMatch.seenHelp';

// ===== State =====
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
cv.width = COLS * TILE; cv.height = ROWS * TILE;
let grid, level, movesLeft, loot, levelScore, busy, selected, runOver;
let bank = Number(localStorage.getItem(BANK_KEY)) || 0;

const depth = () => DEPTHS[Math.min(level, DEPTHS.length) - 1];
const depthName = () => level > DEPTHS.length ? depth().name + ' ' + (level - DEPTHS.length + 1) : depth().name;
const pieceTypes = () => level >= DIAMOND_MIN_LEVEL ? TYPES.concat(DIAMOND) : TYPES;
const rnd = a => a[Math.floor(Math.random() * a.length)];
const mult = () => Math.pow(MULT_PER_LEVEL, level - 1);
const target = () => Math.round(BASE_TARGET * Math.pow(TARGET_GROWTH, level - 1) / 10) * 10;
const mysteryChance = () => MYSTERY_BASE_CHANCE + MYSTERY_CHANCE_PER_LEVEL * (level - 1);
function pickMysteryKind() {
  const ks = Object.keys(MYSTERY_KINDS), w = ks.map(k => MYSTERY_KINDS[k].weight + MYSTERY_KINDS[k].perLevel * (level - 1));
  let x = Math.random() * w.reduce((a, b) => a + b); for (let i = 0; i < ks.length; i++) { x -= w[i]; if (x < 0) return ks[i]; } return ks[0];
}
function newPiece(allowMystery) {
  const p = { type: rnd(pieceTypes()), y: 0, dx: 0, dy: 0, clear: -1 };
  const x = Math.random();
  if (allowMystery && x < mysteryChance()) { p.type = MYSTERY; p.kind = pickMysteryKind(); }
  else if (allowMystery && x < mysteryChance() + CHEST_CHANCE) p.type = CHEST;
  return p;
}
function fillBoard() {
  grid = [];
  for (let c = 0; c < COLS; c++) { grid[c] = []; for (let r = 0; r < ROWS; r++) {
    let p; do { p = newPiece(false); } while (
      (r >= 2 && grid[c][r-1].type === p.type && grid[c][r-2].type === p.type) ||
      (c >= 2 && grid[c-1][r].type === p.type && grid[c-2][r].type === p.type));
    p.y = r; grid[c][r] = p; } }
}
function startLevel(n) { level = n; const d = depth();
  document.body.style.background = d.bg; cv.style.borderColor = d.edge; $('depth').textContent = 'Depth ' + level + ': ' + depthName(); movesLeft = MOVES_PER_LEVEL; levelScore = 0; selected = null; fillBoard(); updHud(); }
function newRun() { loot = 0; runOver = false; busy = false; hideModal(); startLevel(1); }
function setBank(v) { bank = v; localStorage.setItem(BANK_KEY, String(bank)); }
function updHud() {
  $('level').textContent = level; $('moves').textContent = movesLeft; $('mult').textContent = 'x' + (+mult().toFixed(2));
  $('goal').textContent = levelScore + '/' + target(); $('loot').textContent = loot; $('bank').textContent = bank;
  $('goalfill').style.width = Math.min(100, 100 * levelScore / target()) + '%';
}
function addPoints(base) { const p = Math.round(base * mult()); loot += p; levelScore += p; updHud(); }

// ===== Matching =====
const isSpecial = p => p.type === MYSTERY || p.type === CHEST;
function findMatches() {
  const m = new Set();
  const t = (c, r) => grid[c][r] && !isSpecial(grid[c][r]) ? grid[c][r].type : null;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS - 2; c++) {
    const k = t(c, r); if (!k) continue; let e = c; while (e + 1 < COLS && t(e + 1, r) === k) e++;
    if (e - c >= 2) for (let i = c; i <= e; i++) m.add(i + ',' + r); c = e; }
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS - 2; r++) {
    const k = t(c, r); if (!k) continue; let e = r; while (e + 1 < ROWS && t(c, e + 1) === k) e++;
    if (e - r >= 2) for (let i = r; i <= e; i++) m.add(c + ',' + i); r = e; }
  return [...m].map(s => s.split(',').map(Number));
}

// ===== Animation helpers =====
function tween(ms, fn) { return new Promise(res => { const s = performance.now();
  (function f(n) { const k = Math.min(1, Math.max(0, (n - s) / ms)); fn(k); k < 1 ? requestAnimationFrame(f) : res(); })(s); }); }
async function animateSwap(a, b) {
  const pa = grid[a[0]][a[1]], pb = grid[b[0]][b[1]], ddx = b[0] - a[0], ddy = b[1] - a[1];
  await tween(SWAP_MS, k => { pa.dx = ddx * k; pa.dy = ddy * k; pb.dx = -ddx * k; pb.dy = -ddy * k; });
  pa.dx = pa.dy = pb.dx = pb.dy = 0; grid[a[0]][a[1]] = pb; grid[b[0]][b[1]] = pa;
}
async function clearCells(cells) {
  const ps = cells.map(([c, r]) => grid[c][r]).filter(Boolean);
  await tween(CLEAR_MS, k => ps.forEach(p => p.clear = k));
  cells.forEach(([c, r]) => grid[c][r] = null);
}
async function collapse() {
  for (let c = 0; c < COLS; c++) {
    let w = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) if (grid[c][r]) { const p = grid[c][r]; grid[c][r] = null; grid[c][w--] = p; }
    let spawn = -1; for (let r = w; r >= 0; r--) { const p = newPiece(true); p.y = spawn--; grid[c][r] = p; }
  }
  await new Promise(res => { let last = performance.now();
    (function f(n) { const dt = Math.max(0, n - last); last = n; let moving = false;
      for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) { const p = grid[c][r];
        if (p.y < r) { p.y = Math.min(r, p.y + FALL_SPEED * Math.max(dt, 16)); moving = true; } }
      moving ? requestAnimationFrame(f) : res(); })(last); });
}
async function resolve() {
  let combo = 1;
  for (;;) { const m = findMatches(); if (!m.length) break;
    const dia = m.filter(([c, r]) => grid[c][r].type === DIAMOND).length;
    addPoints((m.length + dia * (DIAMOND_POINTS_FACTOR - 1)) * POINTS_PER_PIECE * combo);
    const chests = digChests(m); m.push(...chests); await clearCells(m); await collapse(); combo++; }
}
// Chests next to any matched cell get dug out; returns their cells.
function digChests(m) {
  const key = new Set(m.map(x => x.join(','))), out = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (grid[c][r].type !== CHEST) continue;
    if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx, dy]) => key.has((c + dx) + ',' + (r + dy)))) out.push([c, r]);
  }
  out.forEach(() => {
    if (Math.random() < CHEST_GOLD_ODDS) { const g = Math.round(CHEST_GOLD * mult()); loot += g; levelScore += g; toast('Buried treasure! +' + g, '#ffd75e'); }
    else { movesLeft = Math.max(0, movesLeft - CHEST_TRAP_MOVES); toast('Trap! -' + CHEST_TRAP_MOVES + ' moves', '#ff6b6b'); }
  });
  updHud(); return out;
}
let toastTimer;
function toast(text, color) { const t = $('toast'); t.textContent = text; t.style.color = color; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', TOAST_MS); }
function checkLevelEnd() {
  if (runOver) return;
  if (levelScore >= target()) return showLevelDone();
  if (movesLeft <= 0) return loseRun('Out of moves! You did not reach the goal.');
}
async function trySwap(a, b) {
  if (busy || runOver) return; selected = null;
  if (isSpecial(grid[a[0]][a[1]]) || isSpecial(grid[b[0]][b[1]])) return;
  busy = true; await animateSwap(a, b);
  if (findMatches().length) { movesLeft--; updHud(); await resolve(); busy = false; checkLevelEnd(); }
  else { await animateSwap(a, b); busy = false; }
}

// ===== Run outcomes =====
function showModal(html, buttons) {
  $('msg').innerHTML = html; const bd = $('btns'); bd.innerHTML = '';
  buttons.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = 'big ' + cls; b.textContent = label; b.onclick = fn; bd.appendChild(b); });
  $('modal').style.display = 'flex';
}
function hideModal() { $('modal').style.display = 'none'; }
function showLevelDone() {
  busy = true; const nextMult = +(Math.pow(MULT_PER_LEVEL, level)).toFixed(2);
  showModal(`<h2>Depth ${level} cleared!</h2><p>${depthName()} is done.</p><p>Your loot: <b>${loot}</b></p>
    <p><b>Bank it:</b> put your loot in the bank. It is safe forever. You start again at Level 1.</p>
    <p><b>⛏ Dig deeper:</b> go down to Depth ${level + 1}${level + 1 === DIAMOND_MIN_LEVEL ? ' (diamonds appear here!)' : ''}. Points are worth x${nextMult}, but if you fail you lose all your loot.</p>`,
    [['Bank it', 'good', () => { const got = loot; setBank(bank + loot); hideModal();
        showModal(`<h2>Banked!</h2><p>You saved <b>${got}</b>. Bank total: <b>${bank}</b></p>`, [['New run', '', newRun]]); }],
     ['⛏ Dig deeper', 'bad', digDeeper]]);
}
function digDeeper() {
  const next = DEPTHS[Math.min(level + 1, DEPTHS.length) - 1].name;
  showModal(`<h2>⛏ Digging deeper...</h2><p style="font-size:26px">Down to Depth ${level + 1}: ${next}</p>`, []);
  setTimeout(() => { hideModal(); busy = false; startLevel(level + 1); }, DIG_TRANSITION_MS);
}
function loseRun(why) {
  runOver = true; busy = true; const lost = loot; loot = 0; updHud();
  showModal(`<h2>Run over</h2><p>${why}</p><p>You lost <b>${lost}</b> loot.<br>Your bank is safe: <b>${bank}</b></p>`, [['Try again', '', newRun]]);
}

// ===== Mystery gamble =====
function openMystery(c, r) {
  const k = MYSTERY_KINDS[grid[c][r].kind], reward = Math.round(k.reward * mult()), pct = Math.round(k.win * 100);
  const word = pct >= 70 ? 'Good chance' : pct >= 40 ? 'Coin flip' : 'Risky!';
  busy = true;
  showModal(`<h2>${k.name}</h2><p>${word}: you win <b>${pct} times out of 100</b>.</p>
    <p>Win: get <b>+${reward}</b> loot and clear this row.</p><p>Lose: you lose <b>all your loot</b> and this run ends. (Your bank stays safe.)</p>`,
    [['Take the gamble', 'bad', async () => { hideModal();
        if (Math.random() < k.win) {
          const row = []; for (let i = 0; i < COLS; i++) row.push([i, r]);
          loot += reward; levelScore += reward; updHud();
          await clearCells(row); await collapse(); await resolve(); busy = false;
          showModal(`<h2>You won!</h2><p>+${reward} loot!</p>`, [['Keep playing', 'good', () => { hideModal(); checkLevelEnd(); }]]);
        } else { busy = false; loseRun('The gamble went bad!'); } }],
     ['No thanks', 'good', async () => { hideModal(); await clearCells([[c, r]]); await collapse(); await resolve(); busy = false; checkLevelEnd(); }]]);
}

// ===== Help =====
const HELP_HTML = `<h2>How to play</h2><ul>
  <li>Tap a treasure, then tap the one next to it to swap them. (Or slide your finger.)</li>
  <li>Line up <b>3 or more of the same</b> in a row or column to score.</li>
  <li>Reach the <b>goal</b> before you run out of moves.</li>
  <li>Then choose: <b>Bank it</b> (keep your loot safe) or <b>⛏ Dig deeper</b> into the mine (more points, but you can lose it all). Deep down you may find rare diamonds!</li>
  <li>A <b>buried chest</b> can't be moved. Make a match next to it to dig it out: usually gold, sometimes a trap that costs 3 moves.</li>
  <li>Tap a glowing <b>?</b> piece to gamble. Sparkly = safe-ish, plain = 50/50, skull = risky but huge.</li></ul>`;
function showHelp() { const was = $('modal').style.display === 'flex'; if (was) return;
  showModal(HELP_HTML, [['Got it!', 'good', () => { localStorage.setItem(HELP_KEY, '1'); hideModal(); }]]); }
$('helpBtn').onclick = showHelp;

// ===== Input =====
let down = null;
function cellAt(e) { const b = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - b.left) / (b.width / COLS)), r = Math.floor((e.clientY - b.top) / (b.height / ROWS));
  return c >= 0 && c < COLS && r >= 0 && r < ROWS ? [c, r] : null; }
const adj = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1;
cv.addEventListener('pointerdown', e => { e.preventDefault(); if (busy || runOver) return; const cell = cellAt(e); if (!cell) return;
  if (grid[cell[0]][cell[1]].type === MYSTERY) { selected = null; openMystery(...cell); return; }
  if (grid[cell[0]][cell[1]].type === CHEST) { selected = null; toast('Make a match next to it to dig it out!', '#fff'); return; }
  if (selected && adj(selected, cell)) { trySwap(selected, cell); return; }
  selected = (selected && selected[0] === cell[0] && selected[1] === cell[1]) ? null : cell;
  down = { cell, x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointermove', e => { if (!down || busy) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, b = cv.getBoundingClientRect(), th = DRAG_THRESHOLD * b.width / cv.width;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const [c, r] = down.cell, t = Math.abs(dx) > Math.abs(dy) ? [c + Math.sign(dx), r] : [c, r + Math.sign(dy)];
  down = null; if (t[0] >= 0 && t[0] < COLS && t[1] >= 0 && t[1] < ROWS) trySwap([c, r], t); });
window.addEventListener('pointerup', () => down = null);
window.addEventListener('pointercancel', () => down = null);
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
$('restart').onclick = () => { if (busy && !runOver) return;
  showModal('<h2>Restart?</h2><p>You will lose your current loot. Your bank stays safe.</p>',
    [['Yes, restart', 'bad', newRun], ['Cancel', 'good', hideModal]]); };

// ===== Drawing (original canvas art) =====
const GEM = { ruby: ['#ff8a8a','#d0142c','#5a0010'], emerald: ['#9dffb8','#14a04a','#00401a'],
  sapphire: ['#9cc8ff','#1f4fd8','#0a1a5a'], amethyst: ['#e2b0ff','#8a2ccf','#36084f'], topaz: ['#fff1a0','#f59e0b','#7a3e00'] };
const SHAPE = { ruby: [6, 0], emerald: [8, Math.PI/8], sapphire: [4, 0], amethyst: [3, -Math.PI/2], topaz: [5, -Math.PI/2] };
function poly(n, rad, rot) { ctx.beginPath(); for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } ctx.closePath(); }
function drawMystery(kind, R, now) {
  const pulse = .6 + .4 * Math.sin(now / 200);
  if (kind === 'sparkle') {
    ctx.shadowColor = '#bff'; ctx.shadowBlur = 20 * pulse;
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, R); g.addColorStop(0, '#fff'); g.addColorStop(.5, `hsl(${(now/8)%360},90%,70%)`); g.addColorStop(1, '#2a6');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    for (let i = 0; i < 4; i++) { const a = now / 400 + i * Math.PI / 2, x = Math.cos(a) * R * .8, y = Math.sin(a) * R * .8;
      ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(x, y); poly(4, R * .18 * pulse, 0); ctx.fill(); ctx.restore(); }
  } else if (kind === 'plain') {
    ctx.shadowColor = '#fd8'; ctx.shadowBlur = 12 * pulse;
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-R, -R * .8, R * 2, R * 1.6); ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffd75e'; ctx.lineWidth = 3; ctx.strokeRect(-R, -R * .8, R * 2, R * 1.6);
  } else {
    ctx.shadowColor = '#f33'; ctx.shadowBlur = 18 * pulse;
    ctx.fillStyle = '#e8e2d0'; ctx.beginPath(); ctx.arc(0, -R * .1, R * .85, 0, 7); ctx.fill(); ctx.fillRect(-R * .45, R * .4, R * .9, R * .45); ctx.shadowBlur = 0;
    ctx.fillStyle = '#300'; ctx.beginPath(); ctx.arc(-R * .32, -R * .15, R * .2, 0, 7); ctx.arc(R * .32, -R * .15, R * .2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#300'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(R * .1, -R * .9); ctx.lineTo(-R * .05, -R * .55); ctx.lineTo(R * .12, -R * .4); ctx.stroke();
  }
  ctx.fillStyle = kind === 'skull' ? '#b00' : '#1b1426'; ctx.font = `bold ${R * (kind === 'skull' ? .6 : 1)}px Georgia`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, kind === 'skull' ? R * .55 : 2);
}
function drawPiece(p, x, y, now) {
  const R = TILE * 0.38; let s = 1;
  ctx.save(); ctx.translate(x, y);
  if (p.clear >= 0) { s = 1 + p.clear * 0.4; ctx.globalAlpha = 1 - p.clear; }
